name: TheHerobrine-OG
main: uk.hotten.herobrine.HerobrinePluginOG
version: ${version}
api-version: ${apiVersion}
author: Gxorge
description: Remake of "The Herobrine!" v2 from HiveMC.
depend:
  - ProtocolLib
  - MyWorlds
  - Utilities-OG
softdepend:
  - My_Worlds
  - IllegalStack-OG
  - KnockbackSync-OG
  - Chat-OG
  - Scoreboard-OG

commands:
  hbsetherobrine:
    description: Select a player to be Herobrine.
    permission: theherobrine.command.setherobrine
    usage: /<command> <player>

  hbforcestart:
    description: Force start the game.
    permission: theherobrine.command.forcestart
    usage: /<command> [time]

  hbdropshard:
    description: Drop the shard from the shard holder.
    permission: theherobrine.command.dropshard
    usage: /<command>

  hbpausetimer:
    description: Pause the start timer.
    permission: theherobrine.command.pausetimer
    usage: /<command>

  # /vote and /v are not declared here on purpose: VoteCommandListener claims them inside lobby
  # worlds only, so VotingPlugin keeps the labels everywhere else.

  hbjoin:
    description: Join a lobby.
    usage: /<command> <lobby>

  # Inside lobby worlds HubCommandListener claims /hub, /lobby and /spawn before any other
  # plugin sees them; this registration only matters outside them.
  hub:
    description: Leave The Herobrine lobby or game and return to the main world.
    usage: /<command>
    aliases: [lobby]

  hbcreatelobby:
    description: Create a lobby.
    permission: theherobrine.command.createlobby
    usage: /<command> <hub|number>

  hbdeletelobby:
    description: Delete a lobby.
    permission: theherobrine.command.deletelobby
    usage: /<command> <lobby id>

  hbspectate:
    description: Toggle spectator mode for a round.
    permission: theherobrine.command.spectate
    usage: /<command>

  hbreloadconfigs:
    description: Reload the lobby configuration files.
    permission: theherobrine.command.reloadconfigs
    usage: /<command>

  hbsetspawn:
    description: Set a required map setup datapoint at your current location.
    permission: theherobrine.command.setspawn
    usage: /<command> <survivor|herobrine|alter|shard> [shardIndex|append] [mapName]

  hbwizard:
    description: Show the map setup wizard for your current world.
    permission: theherobrine.command.wizard
    usage: /<command>

permissions:
  theherobrine.overfill:
    description: Join a lobby that is already full.
    default: op
  theherobrine.command.wizard:
    description: Use the /hbwizard map setup walkthrough.
    default: op
  theherobrine.signs.create:
    description: Create [Herobrine] join signs.
    default: op
  theherobrine.signs.destroy:
    description: Destroy [Herobrine] join signs.
    default: op
